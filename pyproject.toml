[project]
name = "bashkuto"
version = "0.1.0"
description = "Bash infrastructure for AI agents"
readme = "README.md"
authors = [
    { name = "Mohamed Sofiene Kadri", email = "ms.kadri.dev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
bashkuto = "bashkuto:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"
